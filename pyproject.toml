[project]
name = "agent2grokbot"
version = "0.3.0"
description = "An async FastAPI MCP server that bridges MCP clients to Grok Bot webhooks"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Anudor" }]
keywords = ["mcp", "webhook", "agent", "sse", "grok-bot"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "sqlmodel[asyncio]>=0.0.48",
]

[project.urls]
Homepage = "https://github.com/Anudorannador/Agent2GrokBot"
Issues = "https://github.com/Anudorannador/Agent2GrokBot/issues"

[project.scripts]
agent2grokbot = "agent2grokbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
